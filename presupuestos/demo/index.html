<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 20/11/2024 21:58 - Reestructurado para separar CSS y JS en archivos externos -->
    <!-- 20/01/2025 - Reestructuración profesional completada con HTML limpio y archivos externos organizados -->
    <title>Presupuestos detallados para empresas y profesionales</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts - Luxury Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/img/logo.png">

    <style>
        /* Ocultar contenido por defecto */
        body {
            display: none;
        }
        
        /* Estilos del Login Overlay */
        #auth-overlay {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .auth-box {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 1px solid #e5e7eb;
        }

        .auth-input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 16px;
        }

        .auth-btn {
            background: #B08D57;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 2px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
        }

        .auth-btn:hover {
            background: #9A7A45;
        }

        .auth-error {
            color: #ef4444;
            margin-top: 10px;
            font-size: 14px;
            display: none;
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Verificar si estamos en un entorno que soporta PHP
                const response = await fetch('auth.php?check_auth=1');
                if (!response.ok) throw new Error('Auth server not reachable');
                
                const data = await response.json();
                
                if (data.authenticated) {
                    showContent();
                } else {
                    showLogin();
                }
            } catch (error) {
                console.error('Error checking auth:', error);
                // Si falla (ej. si se abre el html directamente sin servidor PHP), 
                // mostrar login como fallback aunque no funcionará el submit.
                showLogin();
                document.getElementById('auth-error').textContent = "Error: Se requiere servidor PHP (XAMPP/WAMP) para funcionar.";
                document.getElementById('auth-error').style.display = 'block';
            }
        });

        function showContent() {
            document.body.style.display = 'block';
            const overlay = document.getElementById('auth-overlay');
            if (overlay) overlay.remove();
        }

        function showLogin() {
            // Aseguramos que el body sea visible para mostrar el overlay, 
            // pero el contenido real del sitio puede estar oculto o cubierto
            document.body.style.display = 'block';
            
            // Crear overlay si no existe
            if (!document.getElementById('auth-overlay')) {
                const overlay = document.createElement('div');
                overlay.id = 'auth-overlay';
                overlay.innerHTML = `
                    <div class="auth-box">
                        <img src="assets/img/logo.png" alt="Pr3cise" style="height: 48px; margin-bottom: 20px; object-fit: contain;">
                        <h2 style="font-family: 'Montserrat', sans-serif; font-weight: 700; margin-bottom: 10px; color: #0F172A; letter-spacing: -0.02em;">Acceso Restringido</h2>
                        <p style="color: #6b7280; font-size: 14px; margin-bottom: 20px;">Introduce la contraseña para ver el presupuesto</p>
                        <input type="password" id="auth-pass" class="auth-input" placeholder="Contraseña...">
                        <button class="auth-btn" onclick="submitAuth()">Entrar</button>
                        <p id="auth-error" class="auth-error"></p>
                    </div>
                `;
                document.body.prepend(overlay);
                
                // Permitir enter para enviar
                document.getElementById('auth-pass').addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') submitAuth();
                });
            }
            
            // Ocultar el resto del contenido del body visualmente (opcional, ya que el overlay cubre todo)
            // Array.from(document.body.children).forEach(child => {
            //     if (child.id !== 'auth-overlay') child.style.display = 'none';
            // });
        }

        async function submitAuth() {
            const password = document.getElementById('auth-pass').value;
            const errorMsg = document.getElementById('auth-error');
            
            try {
                const response = await fetch('auth.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password: password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    location.reload(); // Recargar para limpiar estado y mostrar contenido
                } else {
                    errorMsg.textContent = "Contraseña incorrecta";
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                console.error('Error submitting auth:', error);
                errorMsg.textContent = "Error de conexión con el servidor";
                errorMsg.style.display = 'block';
            }
        }
    </script>
</head>

<body class="antialiased pb-12">

    <div class="container mx-auto p-4 md:p-8 max-w-7xl">

        <!-- CABECERA -->
        <header
            class="mb-8 pb-6 border-b border-gray-300 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
            <div class="flex items-center gap-5">
                <img id="project-logo" src="assets/img/logo.png" alt="Pr3cise"
                    class="h-16 w-auto object-contain">
                <div>
                    <h2 class="text-sm font-bold uppercase tracking-widest" style="color:#B08D57" data-i18n="header.budget">Presupuesto</h2>
                    <h1 id="project-title" class="text-3xl font-extrabold text-gray-800">Refugio Eficiente de Montaña
                    </h1>
                    <p id="project-desc" class="text-gray-500 mt-1">Construcción de un mini apartamento de 20m² con
                        estructura de madera y alta eficiencia energética.</p>
                    <p id="project-location" class="text-sm text-gray-400 font-medium mt-2">📍 Serra d'En Galceran,
                        Castellón</p>
                </div>
            </div>
            <div class="text-right flex-shrink-0">
                <p class="text-xs text-gray-400 uppercase tracking-widest">Referencia</p>
                <p id="ref-code" class="font-mono text-gray-700">PRE-2025-001-U</p>
                <div id="ipc-container" class="mt-4 pt-2 border-t border-gray-100 w-48 ml-auto relative">
                    <div id="ipc-lock-overlay"
                        class="absolute inset-0 bg-white/90 backdrop-blur-sm flex items-center justify-end z-10 cursor-pointer"
                        onclick="unlockIPC()">
                        <span class="text-xs text-gray-400 mr-2" data-i18n="ipc.lock">🔒 Ajuste IPC</span>
                    </div>
                    <div id="ipc-controls" class="opacity-0 transition-opacity duration-300">
                        <p class="text-[10px] text-gray-500 uppercase tracking-widest text-right mb-1" data-i18n="ipc.title">Ajuste IPC
                            Materiales 2023</p>
                        <div class="flex items-center gap-2 justify-end">
                            <input type="range" id="ajuste2023-slider" min="0" max="30" step="1" value="0"
                                class="w-24 h-1 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-gray-500"
                                oninput="updateAjuste2023Preview(this.value)" onchange="updateAjuste2023(this.value)">
                            <span id="ajuste2023-value" class="text-xs font-bold text-gray-700 w-8 text-right">0%</span>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- SELECTOR DE PRESUPUESTO -->
        <div class="budget-selector-container mb-6">
            <label for="budget-selector" class="text-sm font-semibold text-gray-600 mr-3" data-i18n="label.selectBudget">📂 Seleccionar
                Presupuesto:</label>
            <select id="budget-selector" class="budget-selector">
                <option value="">Cargando presupuestos...</option>
            </select>
        </div>

        <!-- 19/05/2026 18:25 - BARRA FIJA UNIFICADA con fondo TRANSPARENTE -->
        <div id="sticky-bar" class="sticky top-0 z-30 -mx-4 md:-mx-8 px-4 md:px-8 mb-6">

            <!-- Fila superior: selector de idioma + botones editor (siempre visibles) -->
            <div class="flex items-center gap-3 py-2">

                <!-- Selector de idioma -->
                <!-- 19/05/2026 17:55 - Estilo btn-luxury para selector de idioma; Dutch→Deutsch -->
                <select id="lang-selector" onchange="window.setLang(this.value)"
                    title="Select language / Seleccionar idioma"
                    class="lang-selector-btn">
                    <option value="es">🇪🇸 Español</option>
                    <option value="en">🇬🇧 English</option>
                    <option value="fr">🇫🇷 Français</option>
                    <option value="de">🇩🇪 Deutsch</option>
                </select>

                <!-- Spacer -->
                <div class="flex-1"></div>

                <!-- 19/05/2026 18:25 - Botones del editor SIEMPRE visibles (antes solo en costes/materiales) -->
                <div id="editor-toolbar" class="flex items-center gap-3">
                    <!-- 19/05/2026 18:20 - Restaurado padding original 0.75rem 1.5rem para que los botones se vean como antes -->
                    <button id="btn-restore-backup" class="btn-luxury" style="padding: 0.75rem 1.5rem; font-size: 0.7rem;" onclick="window.showRestoreBackups()" data-i18n="btn.restore">🕐 Restaurar copia de seguridad</button>
                    <button id="btn-toggle-edit" class="btn-luxury" style="padding: 0.75rem 1.5rem; font-size: 0.7rem;" onclick="window.toggleEditMode()" data-i18n="btn.editMode.on">✏️ Activar Modo Edición</button>
                    <button id="btn-undo" class="btn-luxury opacity-50 cursor-not-allowed" style="padding: 0.75rem 1.5rem; font-size: 0.7rem; display: none;" onclick="window.undoEdit()" disabled data-i18n="btn.undo">↩️ Deshacer</button>
                    <button id="btn-save-budget" class="btn-luxury-solid opacity-50 cursor-not-allowed" style="padding: 0.75rem 1.5rem; font-size: 0.7rem; display: none;" onclick="window.saveBudget()" disabled data-i18n="btn.save">💾 Guardar Cambios</button>
                </div>
            </div>

            <!-- Fila inferior: pestañas de navegación -->
            <div class="pb-2">
                <nav class="bg-gray-200 p-2 md:p-3 rounded-2xl shadow-inner backdrop-blur-sm bg-opacity-90">
                    <div class="flex flex-col md:flex-row gap-2 md:gap-4">
                        <button id="nav-cliente" class="nav-button active" data-i18n="nav.cliente">📋 Ficha Técnica (Cliente)</button>
                        <button id="nav-costes" class="nav-button" data-i18n="nav.costes">💰 Desglose de Costes (Técnico)</button>
                        <button id="nav-materiales" class="nav-button" data-i18n="nav.materiales">📦 Materiales</button>
                    </div>
                </nav>
            </div>
        </div>

        <!-- CONTENIDO DINÁMICO -->
        <main id="content-area" class="min-h-[500px]">
            <!-- El contenido se cargará dinámicamente mediante JavaScript -->
        </main>

    </div>

    <!-- JavaScript -->
    <!-- 19/05/2026 17:45 - i18n cargado primero para que window.t() esté disponible -->
    <script src="js/i18n.js?v=20260519"></script>
    <script src="js/script.js?v=20260519"></script>
    <script src="js/editor.js?v=20260519"></script>

</body>

</html>
