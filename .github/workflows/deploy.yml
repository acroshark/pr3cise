# ═══════════════════════════════════════════════════════════════════════
# Despliegue automático a OVH por SFTP
#
# Flujo: editas en local -> git push -> la web se actualiza sola.
#
# ¿Por qué SFTP y no FTPS?
# El primer intento usó FTPS y OVH respondió "500 This security scheme is
# not implemented": el hosting compartido de OVH no implementa FTPS. Las
# opciones eran FTP plano (contraseña viajando en claro por la red) o SFTP.
# Se usa SFTP, que va cifrado sobre SSH en el puerto 22.
#
# Secrets necesarios (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER    ftp.clusterXXX.hosting.ovh.net
#   FTP_USERNAME  usuario
#   FTP_PASSWORD  contraseña
#
# Para subir algo sin desplegar, escribe [skip deploy] en el mensaje del commit.
# ═══════════════════════════════════════════════════════════════════════

name: Desplegar a FTP

on:
  push:
    branches: [main]
    paths-ignore:
      - 'presupuestos/**'
      - '_source-no-deploy/**'
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulacro: conecta y lista qué subiría, pero no sube nada'
        type: boolean
        default: true

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip deploy]')"

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Solo en simulacro: muestra la estructura real del servidor para poder
      # confirmar que server-dir apunta donde debe antes de subir nada.
      - name: Inspeccionar el servidor (solo simulacro)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set sftp:auto-confirm yes;
            open -u '${SFTP_USER}','${SFTP_PASS}' sftp://${SFTP_HOST};
            echo '───── RAÍZ DE LA CONEXIÓN ─────'; cls -l ./;
            echo; echo '───── /www ─────';          cls -l /www/ || echo '  /www NO EXISTE';
          "
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
          IS_DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail

          DRY=""
          if [ "${IS_DRY}" = "true" ]; then
            DRY="--dry-run"
            echo "▶ SIMULACRO: no se subirá ningún archivo"
          else
            echo "▶ DESPLIEGUE REAL"
          fi

          # mirror --reverse sube del runner al servidor.
          # Sin --delete: lo que exista en el servidor y no en el repositorio
          # se queda intacto. Es deliberado; ver exclusiones más abajo.
          lftp -c "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            set net:timeout 30;
            set cmd:fail-exit yes;
            open -u '${SFTP_USER}','${SFTP_PASS}' sftp://${SFTP_HOST};
            mirror --reverse --verbose ${DRY} \
              --exclude '^\.git' \
              --exclude '^\.github/' \
              --exclude '^\.claude/' \
              --exclude '^node_modules/' \
              --exclude '^_source-no-deploy/' \
              --exclude '_deploy-.*\.zip\$' \
              --exclude '^assets/Textos legales/' \
              --exclude '\.psd\$' \
              --exclude '\.md\$' \
              --exclude '\.db\$' \
              --exclude '\.sqlite\$' \
              --exclude '^presupuestos/' \
              --exclude '^admin/data/' \
              --exclude '^admin/config\.php\$' \
              ./ /www/;
          "

          # ── Sobre las exclusiones ──────────────────────────────────────
          # presupuestos/  : lo escribe la propia aplicación en el servidor
          #                  (save_budget.php). Desplegarlo desde git
          #                  sobrescribiría presupuestos reales de clientes.
          # admin/data/    : datos de ejecución.
          # admin/config.php: configuración propia del servidor.

      - name: Resumen
        if: always()
        run: |
          echo "### Despliegue" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Modo: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'simulacro' || 'real' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Comprobar: https://pr3cise.com/ · /en/ · /robots.txt · /sitemap.xml" >> $GITHUB_STEP_SUMMARY
