# ═══════════════════════════════════════════════════════════════════════
# Despliegue automático a OVH por SFTP
#
# Flujo: editas en local -> git push -> la web se actualiza sola.
#
# ¿Por qué SFTP y no FTPS?
# El primer intento usó FTPS y OVH respondió "500 This security scheme is
# not implemented": el hosting compartido de OVH no implementa FTPS. Las
# opciones eran FTP plano (contraseña viajando en claro por la red) o SFTP.
# Se usa SFTP, que va cifrado sobre SSH en el puerto 22.
#
# OJO CON LA RUTA. Dos trampas, ambas detectadas con el simulacro:
#  1. La conexión SFTP aterriza en el HOME del usuario, no en la raíz del
#     sistema: '/www/' absoluto no existe.
#  2. 'www/' NO es la raíz de pr3cise.com. Es un hosting compartido con
#     decenas de proyectos (Silkbliss, Ibiza-Journey, grupolasabina...) y
#     un .htaccess común con cabeceras CORS. Desplegar ahí habría volcado
#     el sitio sobre la raíz compartida y pisado ese .htaccess.
#  El destino correcto es 'www/pr3cise/'.
#
# Secrets necesarios (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER    ftp.clusterXXX.hosting.ovh.net
#   FTP_USERNAME  usuario
#   FTP_PASSWORD  contraseña
#
# Para subir algo sin desplegar, escribe [skip deploy] en el mensaje del commit.
# ═══════════════════════════════════════════════════════════════════════

name: Desplegar a FTP

on:
  push:
    branches: [main]
    paths-ignore:
      - 'presupuestos/**'
      - '_source-no-deploy/**'
      - 'tools/**'
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulacro: conecta y lista qué subiría, pero no sube nada'
        type: boolean
        default: true

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip deploy]')"

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      # Red de seguridad (2026-11-08): si algún PHP tiene un error de sintaxis
      # no se sube nada. No hay entorno de pruebas con PHP en local y un fallo
      # en api/send_mail.php dejaría el formulario de contacto roto en
      # producción sin que nadie lo note.
      - name: Validar sintaxis PHP
        run: |
          set -euo pipefail
          command -v php >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq php-cli; }
          php -v | head -n 1
          fallos=0
          while IFS= read -r -d '' f; do
            if ! php -l "$f" >/dev/null; then
              echo "::error file=$f::Error de sintaxis PHP"
              fallos=1
            fi
          done < <(find api admin -name '*.php' -print0)
          exit $fallos

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Solo en simulacro: muestra la estructura real del servidor para poder
      # confirmar que server-dir apunta donde debe antes de subir nada.
      - name: Inspeccionar el servidor (solo simulacro)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set sftp:auto-confirm yes;
            open -u '${SFTP_USER}','${SFTP_PASS}' sftp://${SFTP_HOST};
            echo '───── RAÍZ DE LA CONEXIÓN ─────'; cls -l ./;
            echo; echo '───── www/pr3cise/ (destino) ─────'; cls -l www/pr3cise/;
          "

      - name: Sincronizar por SFTP
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
          IS_DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail

          DRY=""
          if [ "${IS_DRY}" = "true" ]; then
            DRY="--dry-run"
            echo "▶ SIMULACRO: no se subirá ningún archivo"
          else
            echo "▶ DESPLIEGUE REAL"
          fi

          # mirror --reverse sube del runner al servidor.
          # Sin --delete: lo que exista en el servidor y no en el repositorio
          # se queda intacto. Es deliberado; ver exclusiones más abajo.
          lftp -c "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            set net:timeout 30;
            set cmd:fail-exit yes;
            open -u '${SFTP_USER}','${SFTP_PASS}' sftp://${SFTP_HOST};
            mirror --reverse --verbose ${DRY} \
              --exclude '^\.git' \
              --exclude '^\.github/' \
              --exclude '^\.claude/' \
              --exclude '^node_modules/' \
              --exclude '^_source-no-deploy/' \
              --exclude '^tools/' \
              --exclude '_deploy-.*\.zip\$' \
              --exclude '^assets/Textos legales/' \
              --exclude '\.psd\$' \
              --exclude '^[^/]*\.md\$' \
              --exclude '^admin/LEEME\.md\$' \
              --exclude '\.db\$' \
              --exclude '\.sqlite\$' \
              --exclude '^presupuestos/' \
              --exclude '^admin/data/' \
              --exclude '^admin/config\.php\$' \
              ./ www/pr3cise/;
          "

          # ── Sobre las exclusiones ──────────────────────────────────────
          # presupuestos/  : lo escribe la propia aplicación en el servidor
          #                  (save_budget.php). Desplegarlo desde git
          #                  sobrescribiría presupuestos reales de clientes.
          # admin/data/    : datos de ejecución.
          # admin/config.php: configuración propia del servidor.
          #
          # Los .md NO se excluyen en bloque: los borradores de artículos SON
          # .md y el panel los lee desde el servidor. Con un '\.md$' general la
          # sección de artículos salía vacía en producción sin dar ningún error
          # (comprobado: no se transfería ninguno). Un --include delante tampoco
          # sirve, porque en lftp un --exclude posterior sigue ganando.
          # Por eso se excluyen solo los .md que no deben publicarse:
          #   - los de la raíz del repositorio (README y similares)
          #   - admin/LEEME.md
          # Los de presupuestos/ ya caen por la exclusión de esa carpeta entera.
          # Los borradores no quedan públicos: admin/borradores/.htaccess
          # bloquea el acceso directo, igual que admin/data/ con la base de datos.

      # IndexNow avisa a Bing (que alimenta DuckDuckGo, Ecosia y Yahoo),
      # Yandex, Naver y Seznam de que el sitio ha cambiado, sin esperar a que
      # vengan a rastrear. Google lo ignora (para eso está Search Console).
      # La clave vive publicada en la raíz del sitio: no es un secreto, el
      # protocolo la exige pública para verificar la propiedad del dominio.
      - name: Avisar a los buscadores (IndexNow)
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        run: |
          urls=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<[^>]*>//g' | sed 's/.*/"&"/' | paste -sd, -)
          code=$(curl -s -o /tmp/inr.txt -w '%{http_code}' -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"pr3cise.com\",\"key\":\"3eb628a296701d38a4a549dc9668eaf5\",\"keyLocation\":\"https://pr3cise.com/3eb628a296701d38a4a549dc9668eaf5.txt\",\"urlList\":[${urls}]}") || true
          echo "IndexNow: HTTP ${code:-sin respuesta}"

      - name: Resumen
        if: always()
        run: |
          echo "### Despliegue" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Modo: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'simulacro' || 'real' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Comprobar: https://pr3cise.com/ · /en/ · /robots.txt · /sitemap.xml" >> $GITHUB_STEP_SUMMARY
